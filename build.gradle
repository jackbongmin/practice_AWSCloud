plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.13'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco' // 10_02: 커버리지
}

group = 'com.kyobo.product'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation' // 1단계: @NotBlank 등
	runtimeOnly 'com.h2database:h2'
	// 1단계: Querydsl — Q타입(QProduct)을 컴파일할 때 만든다
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	// JUnit 5 · Mockito · AssertJ · MockMvc가 모두 들어 있다
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging { events 'passed', 'failed' } // 테스트 이름과 결과를 콘솔에 보인다
}

jacoco {
	toolVersion = '0.8.12'
}

// 10_09: 새 기능(리뷰)의 서비스는 줄 커버리지 90% 이상 (10_02와 같은 규칙)
jacocoTestCoverageVerification {
	violationRules {
		rule {
			element = 'CLASS'
			includes = ['com.kyobo.product.ReviewService']
			limit {
				counter = 'LINE'
				minimum = 0.90
			}
		}
	}
}

tasks.named('test') {
	finalizedBy 'jacocoTestReport'
}

tasks.named('check') {
	dependsOn jacocoTestCoverageVerification
}
